<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewCo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="gated">
  <header>
    <h1>NewCo - India Healthcare</h1>
    <p>Revenue cycle analytics for hospitals</p>
    <div class="header-account">
      <span id="userbanner" class="userbanner"></span>
      <button id="signout" class="signout-btn" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <aside id="hospital-panel">
      <h2>Hospitals</h2>
      <ul id="hospital-list"></ul>
      <h2 style="margin-top:1.5rem;">Others</h2>
      <ul id="others-list"></ul>
    </aside>

    <section id="content">
      <h2>Team</h2>
      <div id="team"></div>

      <h2 style="margin-top:2.5rem;">Calendar</h2>
      <div id="calendar">
        <div class="cal-banner">
          <button class="cal-arrow" id="cal-prev" type="button" aria-label="Previous month">&larr;</button>
          <div class="cal-range" id="cal-range"></div>
          <button class="cal-arrow" id="cal-next" type="button" aria-label="Next month">&rarr;</button>
          <div class="cal-search-wrap">
            <input id="cal-search" type="text" autocomplete="off" placeholder="Search events&hellip;">
            <div class="cal-results" id="cal-results" hidden></div>
          </div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </section>
  </main>

  <div class="cal-modal-overlay" id="cal-modal" hidden>
    <div class="cal-modal" role="dialog" aria-label="Day events">
      <div class="cal-modal-head">
        <div class="cal-modal-date" id="cal-modal-date"></div>
        <button class="cal-modal-close" id="cal-modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="cal-modal-body" id="cal-modal-body"></div>
    </div>
  </div>

  <script src="events.js"></script>
  <script src="app.js"></script>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    onAuthStateChanged(auth, async u => {
      if (!u) { location.replace("login.html"); return; }
      document.body.classList.add("authed");
      let name = u.email;
      try { const s = await getDoc(doc(db, "profiles", u.email)); if (s.exists() && s.data().name) name = s.data().name; } catch (e) {}
      const b = document.getElementById("userbanner"); if (b) b.textContent = name;
      const so = document.getElementById("signout");
      if (so) so.addEventListener("click", () => signOut(auth).then(() => location.replace("login.html")));
    });
  </script>
</body>
</html>
