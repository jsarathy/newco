<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewCo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .pass-wrap{position:relative;display:block}
    .pass-wrap .member-input{padding-right:36px;width:100%;box-sizing:border-box}
    .pass-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:2px;opacity:.7}
    .pass-eye:hover{opacity:1}

    /* ---- Right-panel layout: content + calendar column ---- */
    #content{display:grid;gap:28px;align-items:start;grid-template-columns:1fr clamp(280px,30vw,360px)}
    .content-left{min-width:0}
    .content-cal{min-width:0}
    @media (max-width:900px){ #content{grid-template-columns:1fr} }

    /* ---- Calendar ---- */
    .cal-card{border:1px solid rgba(160,170,195,0.25);border-radius:10px;padding:12px;
      background:rgba(255,255,255,0.03)}
    .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .cal-title{font-weight:600;font-size:14px}
    .cal-nav{border:1px solid rgba(160,170,195,0.3);background:transparent;color:inherit;cursor:pointer;
      width:28px;height:28px;border-radius:7px;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
    .cal-nav:hover{background:rgba(160,170,195,0.12)}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .cal-dow{font-size:10px;text-align:center;opacity:.55;padding:2px 0;text-transform:uppercase;letter-spacing:.04em}
    .cal-day{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:7px}
    .cal-day:not(.empty){cursor:pointer}
    .cal-day:not(.empty):hover{background:rgba(160,170,195,0.14)}
    .cal-day.empty{visibility:hidden;cursor:default}
    .cal-day.today{outline:1px solid rgba(160,170,195,0.5)}
    .cal-day.r-meeting{background:#5b7cfa;color:#fff;font-weight:600}
    .cal-day.r-travel{background:#e0883a;color:#fff;font-weight:600}
    .cal-day.r-busy{background:#c0566a;color:#fff;font-weight:600}
    .cal-day.r-available{background:#3f9d6a;color:#fff;font-weight:600}
    .cal-day.selected{box-shadow:0 0 0 2px rgba(255,255,255,0.85) inset}

    /* ---- Day editor ---- */
    .cal-editor{border:1px solid rgba(160,170,195,0.25);border-radius:10px;padding:12px 14px;margin-top:12px;
      background:rgba(255,255,255,0.03);font-size:13px}
    .cal-editor[hidden]{display:none}
    .ed-date{font-weight:600;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
    .ed-close{background:none;border:none;color:inherit;cursor:pointer;opacity:.6;font-size:16px}
    .ed-close:hover{opacity:1}
    .ed-existing{list-style:none;margin:0 0 10px;padding:0}
    .ed-existing li{padding:7px 0;border-top:1px solid rgba(160,170,195,0.15)}
    .ed-mtg-top{display:flex;align-items:center;gap:6px}
    .ed-dot{width:9px;height:9px;border-radius:50%;flex:none}
    .ed-dot.meeting{background:#5b7cfa}.ed-dot.travel{background:#e0883a}
    .ed-dot.busy{background:#c0566a}.ed-dot.available{background:#3f9d6a}
    .ed-mtg-title{flex:1;min-width:0;font-weight:600}
    .ed-mtg-meta{opacity:.65;font-size:12px;margin:2px 0 0 15px}
    .ed-mtg-notes{font-size:12px;margin:3px 0 0 15px;white-space:pre-wrap}
    .ed-act{background:none;border:none;color:inherit;cursor:pointer;opacity:.6;font-size:12px;padding:0 3px}
    .ed-act:hover{opacity:1}
    .ed-form{display:grid;gap:6px}
    .ed-form input,.ed-form select,.ed-form textarea{
      width:100%;box-sizing:border-box;font:inherit;color:inherit;
      background:rgba(255,255,255,0.04);border:1px solid rgba(160,170,195,0.3);border-radius:7px;padding:6px 8px}
    .ed-two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .ed-form textarea{resize:vertical}
    .ed-btns{display:flex;gap:8px;align-items:center}
    .cal-link{color:#9db4ff;text-decoration:none}
    .cal-link:hover{text-decoration:underline}

    /* ---- Next meetings ---- */
    .cal-recent{margin-top:16px}
    .cal-recent-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-bottom:8px}
    .cal-recent-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
    .cal-recent-list li{font-size:13px;display:flex;gap:7px;align-items:flex-start}
    .cal-recent-meta{opacity:.6;font-size:12px}
    .cal-empty{opacity:.55;font-style:italic}
  </style>
</head>
<body class="gated">
  <header>
    <h1>NewCo - India Healthcare</h1>
    <p><a href="index.html" style="color:#a9b4cc;">&larr; Back</a></p>
    <div class="header-account">
      <span id="userbanner" class="userbanner"></span>
      <button id="signout" class="signout-btn" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <aside id="member-side"></aside>
    <section id="content">
      <div class="content-left">
        <h2 id="member-name"></h2>
        <div id="member-role" class="role"></div>
      </div>
      <div class="content-cal">
        <div class="cal-card">
          <div class="cal-head">
            <button class="cal-nav" id="cal-prev" type="button" aria-label="Previous month">&lsaquo;</button>
            <div class="cal-title" id="cal-title"></div>
            <button class="cal-nav" id="cal-next" type="button" aria-label="Next month">&rsaquo;</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="cal-editor" id="cal-editor" hidden></div>
        <div class="cal-recent">
          <div class="cal-recent-title">Next 3 meetings</div>
          <ul class="cal-recent-list" id="cal-recent-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut, updatePassword, reauthenticateWithCredential,
             EmailAuthProvider, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const ADMIN = "admin@newco-ihc.dev";
    const slug = new URLSearchParams(location.search).get("id") || "";

    // local fallbacks if the profile doc doesn't exist yet
    const FALLBACK = {
      "jiten-sarathy":"Jiten Sarathy","krishna-kottapalli":"Krishna Kottapalli",
      "ramesh-viswanatham":"Ramesh Viswanatham","vikram-vijay":"Vikram Vijay",
      "aditya-poosarla":"Aditya Poosarla","sathya-garimela":"Sathya Garimela",
      "jyothsna-diaz":"Jyothsna Diaz","sowmya-kottapalli":"Sowmya Kottapalli",
    };

    const esc = s => String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

    const side = document.getElementById("member-side");
    const nameH = document.getElementById("member-name");

    // ---- Meeting calendar constants ----
    const MONTHS = ["January","February","March","April","May","June",
                    "July","August","September","October","November","December"];
    const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];
    const pad = n => String(n).padStart(2, "0");
    const iso = (y, m, day) => `${y}-${pad(m + 1)}-${pad(day)}`;
    const KIND_LABEL = { meeting:"Meeting", travel:"Travel", busy:"Unavailable", available:"Available" };
    const pretty = s => { const [y,m,dd] = s.split("-").map(Number); return `${dd} ${MONTHS[m-1].slice(0,3)} ${y}`; };
    const todayISO = (() => { const t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); })();
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const coversDay = (s, m) => s >= m.date && s <= (m.endDate || m.date);
    const timeStr = m => m.startTime ? (m.startTime + (m.endTime ? "\u2013" + m.endTime : "")) : "";
    const isLink = u => /^https?:\/\//i.test(u || "");

    onAuthStateChanged(auth, async user => {
      if (!user) { location.replace("login.html"); return; }
      document.body.classList.add("authed");

      const so = document.getElementById("signout");
      if (so) so.addEventListener("click", () => signOut(auth).then(() => location.replace("login.html")));

      // header banner = signed-in user's own name
      try {
        // not critical; banner falls back to email
      } catch (e) {}

      const ref = doc(db, "profiles", slug);
      let data = { name: FALLBACK[slug] || slug, email: "", phone: "", uid: null };
      let exists = false;
      try {
        const snap = await getDoc(ref);
        if (snap.exists()) { data = snap.data(); exists = true; }
      } catch (e) {}

      // set header banner from the viewer's own email (simple + reliable)
      const b = document.getElementById("userbanner");
      if (b) b.textContent = user.email;

      const isAdmin = user.email === ADMIN;
      const claimed = !!data.uid;
      const isOwner = claimed ? data.uid === user.uid : (data.email && data.email === user.email);
      const canEdit = isAdmin || isOwner;

      nameH.textContent = data.name || (FALLBACK[slug] || slug);

      render(data, canEdit);
      wireCalendar(data, canEdit);

      function render(d, editable) {
        if (!editable) {
          side.innerHTML = `
            <div class="member-name">${esc(d.name)}</div>
            <div class="side-section">
              <div class="side-section-title">Account</div>
              <div class="member-field"><span class="member-field-label">Phone</span><span class="member-field-value">${esc(d.phone) || "\u2014"}</span></div>
              <div class="member-field"><span class="member-field-label">Email</span><span class="member-field-value">${esc(d.email) || "\u2014"}</span></div>
            </div>`;
          return;
        }
        side.innerHTML = `
          <div class="member-name">${esc(d.name)}</div>
          <div class="side-section">
            <div class="side-section-title">Account ${isAdmin && !isOwner ? "(admin edit)" : ""}</div>
            <div class="member-field"><span class="member-field-label">Name</span>
              <input class="member-input" id="f-name" type="text" value="${esc(d.name)}"></div>
            <div class="member-field"><span class="member-field-label">Phone</span>
              <input class="member-input" id="f-phone" type="text" value="${esc(d.phone)}"></div>
            <div class="member-field"><span class="member-field-label">Email</span>
              <input class="member-input" id="f-email" type="email" value="${esc(d.email)}"></div>
            <button class="auth-btn" id="f-save" type="button">Save</button>
            <div class="member-save-msg" id="f-msg"></div>
          </div>
          <div class="side-section">
            <div class="side-section-title">Password</div>
            ${isOwner ? `
              <div class="member-field">
                <span class="pass-wrap">
                  <input class="member-input" id="f-pass" type="password" autocomplete="new-password" placeholder="New password">
                  <button type="button" id="f-pass-eye" class="pass-eye" aria-label="Show password" aria-pressed="false">\u{1F441}\u{FE0F}</button>
                </span></div>
              <button class="auth-btn" id="f-pass-save" type="button">Update password</button>
              <div class="member-save-msg" id="f-pass-msg"></div>
            ` : `
              <div class="member-field"><span class="member-field-value">Send a reset link to ${esc(d.email) || "this member"}.</span></div>
              <button class="auth-btn" id="f-pass-reset" type="button">Send reset email</button>
              <div class="member-save-msg" id="f-pass-msg"></div>
            `}
          </div>`;
        document.getElementById("f-save").addEventListener("click", save);
        if (isOwner) {
          const eye = document.getElementById("f-pass-eye");
          eye.addEventListener("click", () => {
            const inp = document.getElementById("f-pass");
            const show = inp.type === "password";
            inp.type = show ? "text" : "password";
            eye.setAttribute("aria-pressed", show ? "true" : "false");
            eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
          });
          document.getElementById("f-pass-save").addEventListener("click", updatePass);
        } else {
          document.getElementById("f-pass-reset").addEventListener("click", resetPass);
        }
      }

      function wireCalendar(d, editable) {
        let meetings = Array.isArray(d.meetings) ? d.meetings.slice() : [];
        const grid = document.getElementById("cal-grid");
        const titleEl = document.getElementById("cal-title");
        const editor = document.getElementById("cal-editor");
        const recentEl = document.getElementById("cal-recent-list");
        const today = new Date();
        let vY = today.getFullYear(), vM = today.getMonth();
        let selected = null, editingId = null;

        function renderMonth() {
          titleEl.textContent = `${MONTHS[vM]} ${vY}`;
          const firstDow = new Date(vY, vM, 1).getDay();
          const days = new Date(vY, vM + 1, 0).getDate();
          let html = DOW.map(x => `<div class="cal-dow">${x}</div>`).join("");
          for (let i = 0; i < firstDow; i++) html += `<div class="cal-day empty"></div>`;
          for (let dd = 1; dd <= days; dd++) {
            const s = iso(vY, vM, dd);
            const cls = ["cal-day"];
            const hits = meetings.filter(m => coversDay(s, m));
            if (hits.length) cls.push("r-" + hits[hits.length - 1].kind);
            if (s === selected) cls.push("selected");
            if (s === todayISO) cls.push("today");
            const tip = hits.map(m => KIND_LABEL[m.kind] + (m.title ? ": " + m.title : "")).join(" \u2022 ");
            html += `<div class="${cls.join(" ")}" data-iso="${s}"${tip ? ` title="${esc(tip)}"` : ""}>${dd}</div>`;
          }
          grid.innerHTML = html;
        }

        function renderRecent() {
          const up = meetings
            .filter(m => (m.endDate || m.date) >= todayISO)
            .sort((a, b) => (a.date + (a.startTime || "")).localeCompare(b.date + (b.startTime || "")))
            .slice(0, 3);
          recentEl.innerHTML = up.length
            ? up.map(m => {
                const t = timeStr(m);
                const lk = isLink(m.link) ? ` \u00b7 <a class="cal-link" href="${esc(m.link)}" target="_blank" rel="noopener">join</a>` : "";
                return `<li><span class="ed-dot ${m.kind}"></span><span>${esc(m.title) || esc(KIND_LABEL[m.kind])}
                  <span class="cal-recent-meta">${esc(pretty(m.date))}${t ? " " + esc(t) : ""}${lk}</span></span></li>`;
              }).join("")
            : `<li class="cal-empty">No upcoming meetings.</li>`;
        }

        function openDay(dayISO) {
          selected = dayISO; editingId = null;
          renderMonth();
          editor.hidden = false;
          const onDay = meetings.filter(m => coversDay(dayISO, m));
          const existing = onDay.length ? `<ul class="ed-existing">${onDay.map(m => {
            const t = timeStr(m);
            const lk = isLink(m.link) ? ` \u00b7 <a class="cal-link" href="${esc(m.link)}" target="_blank" rel="noopener">link</a>` : (m.link ? " \u00b7 " + esc(m.link) : "");
            const span = m.endDate && m.endDate !== m.date ? `${esc(pretty(m.date))} \u2013 ${esc(pretty(m.endDate))}` : esc(pretty(m.date));
            return `<li>
              <div class="ed-mtg-top"><span class="ed-dot ${m.kind}"></span>
                <span class="ed-mtg-title">${esc(m.title) || esc(KIND_LABEL[m.kind])}</span>
                ${editable ? `<button class="ed-act" type="button" data-edit="${m.id}">edit</button><button class="ed-act" type="button" data-del="${m.id}">delete</button>` : ""}</div>
              <div class="ed-mtg-meta">${span}${t ? " \u00b7 " + esc(t) : ""}${lk}</div>
              ${m.notes ? `<div class="ed-mtg-notes">${esc(m.notes)}</div>` : ""}
            </li>`;
          }).join("")}</ul>` : (editable ? "" : `<div class="cal-empty">No meetings.</div>`);

          const form = editable ? `
            <div class="ed-form">
              <input id="ed-title" type="text" placeholder="Title">
              <select id="ed-kind">
                <option value="meeting">Meeting</option>
                <option value="travel">Travel</option>
                <option value="busy">Unavailable</option>
                <option value="available">Available</option>
              </select>
              <div class="ed-two">
                <input id="ed-start" type="date" value="${dayISO}">
                <input id="ed-end" type="date" value="${dayISO}">
              </div>
              <div class="ed-two">
                <input id="ed-stime" type="time">
                <input id="ed-etime" type="time">
              </div>
              <input id="ed-link" type="text" placeholder="Google Meet / Zoom link">
              <textarea id="ed-notes" rows="2" placeholder="Notes"></textarea>
              <div class="ed-btns">
                <button class="auth-btn" id="ed-save" type="button">Save meeting</button>
                <span class="member-save-msg" id="ed-msg"></span>
              </div>
            </div>` : "";

          editor.innerHTML =
            `<div class="ed-date">${esc(pretty(dayISO))}<button class="ed-close" id="ed-close" type="button" aria-label="Close">\u00d7</button></div>`
            + existing + form;

          document.getElementById("ed-close").addEventListener("click", () => {
            editor.hidden = true; selected = null; renderMonth();
          });
          if (!editable) return;
          document.getElementById("ed-save").addEventListener("click", saveMeeting);
          editor.querySelectorAll("[data-del]").forEach(b =>
            b.addEventListener("click", () => removeMeeting(b.dataset.del)));
          editor.querySelectorAll("[data-edit]").forEach(b =>
            b.addEventListener("click", () => loadIntoForm(b.dataset.edit)));
        }

        function loadIntoForm(id) {
          const m = meetings.find(x => x.id === id); if (!m) return;
          editingId = id;
          document.getElementById("ed-title").value = m.title || "";
          document.getElementById("ed-kind").value = m.kind || "meeting";
          document.getElementById("ed-start").value = m.date;
          document.getElementById("ed-end").value = m.endDate || m.date;
          document.getElementById("ed-stime").value = m.startTime || "";
          document.getElementById("ed-etime").value = m.endTime || "";
          document.getElementById("ed-link").value = m.link || "";
          document.getElementById("ed-notes").value = m.notes || "";
          const msg = document.getElementById("ed-msg");
          msg.className = "member-save-msg"; msg.textContent = "Editing\u2026";
        }

        async function saveMeeting() {
          const msg = document.getElementById("ed-msg");
          const date = document.getElementById("ed-start").value;
          let endDate = document.getElementById("ed-end").value || date;
          if (!date) { msg.className = "member-save-msg err"; msg.textContent = "Pick a start date."; return; }
          if (endDate < date) { msg.className = "member-save-msg err"; msg.textContent = "End is before start."; return; }
          const rec = {
            id: editingId || newId(),
            title: document.getElementById("ed-title").value.trim(),
            kind: document.getElementById("ed-kind").value,
            date, endDate,
            startTime: document.getElementById("ed-stime").value,
            endTime: document.getElementById("ed-etime").value,
            link: document.getElementById("ed-link").value.trim(),
            notes: document.getElementById("ed-notes").value.trim(),
          };
          if (editingId) meetings = meetings.map(m => m.id === editingId ? rec : m);
          else meetings.push(rec);
          await persist({ meetings }, msg, "Saved.");
          d.meetings = meetings;
          renderMonth(); renderRecent(); openDay(rec.date);
        }

        async function removeMeeting(id) {
          meetings = meetings.filter(m => m.id !== id);
          await persist({ meetings }, document.getElementById("ed-msg"), "Removed.");
          d.meetings = meetings;
          renderMonth(); renderRecent(); openDay(selected);
        }

        grid.addEventListener("click", e => {
          const cell = e.target.closest(".cal-day:not(.empty)"); if (!cell) return;
          openDay(cell.dataset.iso);
        });
        document.getElementById("cal-prev").addEventListener("click", () => { vM--; if (vM < 0) { vM = 11; vY--; } renderMonth(); });
        document.getElementById("cal-next").addEventListener("click", () => { vM++; if (vM > 11) { vM = 0; vY++; } renderMonth(); });

        renderMonth(); renderRecent();
      }

      async function persist(patch, msgEl, okText) {
        if (msgEl) { msgEl.className = "member-save-msg"; msgEl.textContent = "Saving\u2026"; }
        try {
          if (exists) await updateDoc(ref, patch);
          else {
            await setDoc(ref, Object.assign({ uid: isOwner ? user.uid : null, name: data.name || (FALLBACK[slug] || slug) }, patch));
            exists = true;
          }
          if (msgEl) { msgEl.className = "member-save-msg ok"; msgEl.textContent = okText; }
        } catch (e) {
          if (msgEl) { msgEl.className = "member-save-msg err"; msgEl.textContent = "Failed: " + (e.code || e.message); }
        }
      }

      async function updatePass() {
        const m = document.getElementById("f-pass-msg");
        const np = document.getElementById("f-pass").value;
        if (np.length < 6) { m.className = "member-save-msg err"; m.textContent = "Min 6 characters."; return; }
        m.className = "member-save-msg"; m.textContent = "Updating\u2026";
        try {
          await updatePassword(user, np);
          m.className = "member-save-msg ok"; m.textContent = "Password updated.";
          document.getElementById("f-pass").value = "";
        } catch (e) {
          if (e.code === "auth/requires-recent-login") {
            const cur = prompt("Confirm your current password:");
            if (!cur) { m.className = "member-save-msg err"; m.textContent = "Cancelled."; return; }
            try {
              await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, cur));
              await updatePassword(user, np);
              m.className = "member-save-msg ok"; m.textContent = "Password updated.";
              document.getElementById("f-pass").value = "";
            } catch (e2) {
              m.className = "member-save-msg err"; m.textContent = "Failed: " + (e2.code || e2.message);
            }
          } else {
            m.className = "member-save-msg err"; m.textContent = "Failed: " + (e.code || e.message);
          }
        }
      }

      async function resetPass() {
        const m = document.getElementById("f-pass-msg");
        if (!data.email) { m.className = "member-save-msg err"; m.textContent = "No email on file."; return; }
        m.className = "member-save-msg"; m.textContent = "Sending\u2026";
        try {
          await sendPasswordResetEmail(auth, data.email);
          m.className = "member-save-msg ok"; m.textContent = "Reset email sent.";
        } catch (e) {
          m.className = "member-save-msg err"; m.textContent = "Failed: " + (e.code || e.message);
        }
      }

      async function save() {
        const m = document.getElementById("f-msg");
        const payload = {
          name:  document.getElementById("f-name").value.trim(),
          phone: document.getElementById("f-phone").value.trim(),
          email: document.getElementById("f-email").value.trim(),
        };
        // owner claiming for the first time must set their uid
        if (isOwner && !claimed) payload.uid = user.uid;
        m.textContent = "Saving\u2026"; m.className = "member-save-msg";
        try {
          if (exists) await updateDoc(ref, payload);
          else        await setDoc(ref, Object.assign({ uid: isOwner ? user.uid : null }, payload));
          m.className = "member-save-msg ok"; m.textContent = "Saved.";
          nameH.textContent = payload.name;
          document.querySelector(".member-name").textContent = payload.name;
        } catch (e) {
          m.className = "member-save-msg err";
          m.textContent = "Could not save: " + (e.code || e.message);
        }
      }
    });
  </script>
</body>
</html>
